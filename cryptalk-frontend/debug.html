<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CrypTalk Debug - Troubleshooting white screen issue" />
    <title>CrypTalk Debug</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
      }
      .error-container {
        padding: 20px;
        margin: 20px;
        background-color: #ffeeee;
        border: 1px solid #cc0000;
        border-radius: 4px;
      }
      .success-message {
        padding: 20px;
        margin: 20px;
        background-color: #eeffee;
        border: 1px solid #00cc00;
        border-radius: 4px;
      }
      pre {
        overflow: auto;
        max-height: 300px;
        background-color: #f9f9f9;
        padding: 10px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>    <div id="info-panel">
      <h1 style="padding: 20px;">CrypTalk Debug Mode</h1>
      <div style="padding: 0 20px;">
        <p>This page is attempting to debug the white screen issue.</p>
        <p>Check the browser console for detailed error messages.</p>
        <p><a href="/test-dependencies.html" style="color: blue; text-decoration: underline;">Run Dependency Test</a></p>
      </div>
    </div>
    
    <div id="root"></div>
    
    <script type="module">
      // Global error handler
      window.addEventListener('error', (event) => {
        console.error('[Debug] Error caught:', event.error || event);
        
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-container';
        errorDiv.innerHTML = `
          <h3>Error Detected</h3>
          <p><strong>${event.error?.message || event.message || 'Unknown error'}</strong></p>
          <pre>${event.error?.stack || 'No stack trace available'}</pre>
        `;
        
        document.body.appendChild(errorDiv);
      });
      
      // First test: Can we import React?
      try {
        const React = await import('react');
        const ReactDOM = await import('react-dom/client');
        
        console.log('[Debug] React imported successfully:', React.version);
        
        // Create simple component
        const TestComponent = React.createElement('div', {
          style: { padding: '20px', backgroundColor: '#ffffff', margin: '20px', borderRadius: '4px' }
        }, [
          React.createElement('h2', {}, 'React Import Test'),
          React.createElement('p', {}, `React ${React.version} loaded successfully`),
        ]);
        
        // Render to the page
        const container = document.createElement('div');
        container.id = 'react-test-container';
        document.body.appendChild(container);
        
        ReactDOM.createRoot(container).render(TestComponent);
        
        console.log('[Debug] Basic React rendering worked');
      } catch (error) {
        console.error('[Debug] React import/render failed:', error);
        
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-container';
        errorDiv.innerHTML = `
          <h3>React Import/Render Error</h3>
          <p><strong>${error.message}</strong></p>
          <pre>${error.stack}</pre>
        `;
        
        document.body.appendChild(errorDiv);
      }
      
      // Second test: Try to import the main app entry point
      try {
        console.log('[Debug] Trying to import main entry point...');
        
        // Dynamic import with error handling
        import('./debug-main.jsx')
          .then(() => {
            console.log('[Debug] App entry point imported successfully');
            
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.innerHTML = `
              <h3>App Module Import Success</h3>
              <p>The application module was imported successfully.</p>
            `;
            
            document.body.appendChild(successDiv);
          })
          .catch(error => {
            console.error('[Debug] App import failed:', error);
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-container';
            errorDiv.innerHTML = `
              <h3>App Module Import Error</h3>
              <p><strong>${error.message}</strong></p>
              <pre>${error.stack}</pre>
            `;
            
            document.body.appendChild(errorDiv);
          });
      } catch (error) {
        console.error('[Debug] Error setting up app import:', error);
      }
    </script>
  </body>
</html>
