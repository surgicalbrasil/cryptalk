# Prometheus Configuration for CrysTalk Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cryptalk'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: '/metrics'

  # CrysTalk Monitoring Service
  - job_name: 'cryptalk-monitoring'
    static_configs:
      - targets: ['monitoring:9090']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Claude Orchestrator
  - job_name: 'claude-orchestrator'
    static_configs:
      - targets: ['claude-orchestrator:3000']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Nginx Exporter
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 30s
    metrics_path: '/nginx_status'
    scrape_timeout: 10s

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Docker containers (via cAdvisor)
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Custom application metrics
  - job_name: 'cryptalk-app'
    static_configs:
      - targets: ['claude-orchestrator:8080']
    scrape_interval: 15s
    metrics_path: '/api/metrics'
    scrape_timeout: 10s

  # Health checks endpoint
  - job_name: 'health-checks'
    static_configs:
      - targets: ['monitoring:3003']
    scrape_interval: 30s
    metrics_path: '/health'
    scrape_timeout: 10s
    scheme: 'http'

# Remote storage configuration (optional)
# remote_write:
#   - url: "https://prometheus-remote-write-endpoint.com/api/v1/write"
#     headers:
#       Authorization: "Bearer YOUR_TOKEN"

# Remote read configuration (optional)
