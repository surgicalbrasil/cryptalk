version: '3.8'

services:
  # Serviço principal do Claude Code
  claude-service:
    build:
      context: ./claude-service
      dockerfile: Dockerfile
    container_name: claude-code-main
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOCKER_SOCKET=/var/run/docker.sock
    ports:
      - "3000:3000"
    volumes:
      - ./claude-service/uploads:/app/uploads
      - ./claude-service/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - claude-data:/app/data
    networks:
      - claude-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    user: "1001:1001"

  # Serviço de monitoramento
  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: claude-code-monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - claude-network
    depends_on:
      - claude-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Nginx como reverse proxy
  nginx:
    image: nginx:alpine
    container_name: claude-code-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/static:/var/www/claude-code/static:ro
      - ./nginx/errors:/var/www/claude-code/errors:ro
    networks:
      - claude-network
    depends_on:
      - claude-service
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Redis para cache e sessões
  redis:
    image: redis:7-alpine
    container_name: claude-code-redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-defaultpassword}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - claude-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # PostgreSQL para metadados (opcional)
  postgres:
    image: postgres:15-alpine
    container_name: claude-code-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-claude_code}
      - POSTGRES_USER=${DB_USER:-claude_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - claude-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-claude_user} -d ${DB_NAME:-claude_code}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: claude-code-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - claude-network
    depends_on:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Grafana para visualização
  grafana:
    image: grafana/grafana:latest
    container_name: claude-code-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - claude-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Watchtower para atualizações automáticas
  watchtower:
    image: containrrr/watchtower
    container_name: claude-code-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_STOPPED=true
    networks:
      - claude-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

networks:
  claude-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  claude-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local