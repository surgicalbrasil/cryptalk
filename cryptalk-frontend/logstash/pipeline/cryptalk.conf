# Logstash Pipeline Configuration for CrysTalk
# ============================================

input {
  # Docker logs
  beats {
    port => 5044
  }
  
  # Syslog
  syslog {
    port => 5000
  }
  
  # HTTP logs
  http {
    port => 8080
  }
  
  # Redis logs
  redis {
    host => "redis"
    port => 6379
    password => "cryptalk_redis_password_123"
    key => "logstash"
    data_type => "list"
  }
  
  # PostgreSQL logs
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/vendor/jdbc/postgresql-42.6.0.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/cryptalk"
    jdbc_user => "cryptalk_user"
    jdbc_password => "secure_password_123"
    statement => "SELECT * FROM logs WHERE created_at > :sql_last_value"
    use_column_value => true
    tracking_column => "created_at"
    tracking_column_type => "timestamp"
    schedule => "*/5 * * * *"
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Parse Nginx logs
  if [source] == "/var/log/nginx/access.log" {
    grok {
      match => { "message" => "%{NGINXACCESS}" }
    }
    
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
    
    mutate {
      convert => { "response" => "integer" }
      convert => { "bytes" => "integer" }
      convert => { "responsetime" => "float" }
    }
  }
  
  # Parse HAProxy logs
  if [source] == "/var/log/haproxy/haproxy.log" {
    grok {
      match => { "message" => "%{HAPROXYHTTP}" }
    }
  }
  
  # Parse PostgreSQL logs
  if [source] == "/var/log/postgresql/postgresql.log" {
    grok {
      match => { "message" => "%{POSTGRESQL}" }
    }
  }
  
  # Parse Redis logs
  if [source] == "/var/log/redis/redis.log" {
    grok {
      match => { "message" => "%{REDISLOG}" }
    }
  }
  
  # Parse Docker logs
  if [container] {
    mutate {
      add_field => { "service" => "%{[container][name]}" }
      add_field => { "container_id" => "%{[container][id]}" }
    }
  }
  
  # Add timestamp
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
  
  # Add environment
  mutate {
    add_field => { "environment" => "production" }
    add_field => { "application" => "cryptalk" }
  }
  
  # Geo IP
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # User Agent
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }
  
  # Error classification
  if [level] == "error" or [log_level] == "error" {
    mutate {
      add_tag => ["error"]
    }
  }
  
  if [level] == "warn" or [log_level] == "warn" {
    mutate {
      add_tag => ["warning"]
    }
  }
  
  # Performance classification
  if [response_time] and [response_time] > 1000 {
    mutate {
      add_tag => ["slow_request"]
    }
  }
  
  # Security classification
  if [status] == 401 or [status] == 403 {
    mutate {
      add_tag => ["security"]
    }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => ["@version", "host", "path", "tags"]
  }
}

output {
  # Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "cryptalk-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    template_name => "cryptalk"
    template_pattern => "cryptalk-*"
    template => "/usr/share/logstash/templates/cryptalk.json"
    template_overwrite => true
  }
  
  # Redis for real-time monitoring
  redis {
    host => "redis"
    port => 6379
    password => "cryptalk_redis_password_123"
    key => "realtime-logs"
    data_type => "list"
  }
  
  # File output for backup
  file {
    path => "/usr/share/logstash/logs/cryptalk-%{+YYYY.MM.dd}.log"
    codec => json_lines
  }
  
  # Error logs to separate index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "cryptalk-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # Security logs to separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "cryptalk-security-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # Performance logs to separate index
  if "slow_request" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "cryptalk-performance-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # Debug output
  if [debug] {
    stdout {
      codec => rubydebug
    }
  }
}