# HAProxy Configuration for CrysTalk
# ==================================

global
    daemon
    maxconn 4096
    log stdout local0
    
    # SSL Configuration
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option redispatch
    option forwardfor
    option http-server-close
    
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout check 2000ms
    
    # Error pages
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Statistics
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-node
    stats show-legends
    stats realm HAProxy\ Statistics
    stats auth admin:admin123

# Main frontend
frontend cryptalk_frontend
    bind *:8080
    mode http
    
    # Rate limiting
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 20 }
    
    # Health checks
    acl is_health_check path_beg /health
    use_backend health_backend if is_health_check
    
    # API routing
    acl is_api path_beg /api
    use_backend api_backend if is_api
    
    # WebSocket routing
    acl is_websocket hdr(Upgrade) -i websocket
    use_backend websocket_backend if is_websocket
    
    # Static files
    acl is_static path_beg /static
    use_backend static_backend if is_static
    
    # Monitoring
    acl is_monitoring path_beg /monitoring
    use_backend monitoring_backend if is_monitoring
    
    # Default backend
    default_backend app_backend

# Health check backend
backend health_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    server health1 nginx:80 check

# API backend
backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    
    # Connection pooling
    http-reuse safe
    
    # Servers
    server api1 claude-service:3000 check
    server api2 claude-service:3000 check backup

# WebSocket backend
backend websocket_backend
    mode http
    balance source
    option httpchk GET /ws/health
    
    # WebSocket specific settings
    timeout tunnel 3600s
    timeout server 3600s
    timeout client 3600s
    
    server ws1 claude-service:3000 check

# Static files backend
backend static_backend
    mode http
    balance roundrobin
    option httpchk GET /static/health.txt
    
    server static1 nginx:80 check

# Monitoring backend
backend monitoring_backend
    mode http
    balance roundrobin
    option httpchk GET /monitoring/health
    
    server monitor1 monitoring:9090 check

# Main application backend
backend app_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    
    # Connection pooling
    http-reuse safe
    
    # Compression
    compression algo gzip
    compression type text/html text/plain text/css text/javascript application/javascript application/json
    
    # Caching
    http-response set-header Cache-Control "max-age=300"
    
    # Servers
    server app1 claude-service:3000 check
    server app2 claude-service:3000 check backup

# Database backend (for admin tools)
backend database_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    
    server db1 postgres:5432 check