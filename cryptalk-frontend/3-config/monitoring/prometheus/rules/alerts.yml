groups:
  - name: cryptalk.rules
    rules:
      # System Resource Alerts
      - alert: HighCpuUsage
        expr: system_cpu_usage > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes. Current value: {{ $value }}%"

      - alert: CriticalCpuUsage
        expr: system_cpu_usage > 95
        for: 1m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical CPU usage detected"
          description: "CPU usage is above 95% for more than 1 minute. Current value: {{ $value }}%"

      - alert: HighMemoryUsage
        expr: system_memory_usage > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for more than 5 minutes. Current value: {{ $value }}%"

      - alert: CriticalMemoryUsage
        expr: system_memory_usage > 95
        for: 1m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical memory usage detected"
          description: "Memory usage is above 95% for more than 1 minute. Current value: {{ $value }}%"

      - alert: HighDiskUsage
        expr: system_disk_usage > 80
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High disk usage detected"
          description: "Disk usage is above 80% for more than 10 minutes. Current value: {{ $value }}%"

      - alert: CriticalDiskUsage
        expr: system_disk_usage > 90
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical disk usage detected"
          description: "Disk usage is above 90% for more than 5 minutes. Current value: {{ $value }}%"

      # Container Alerts
      - alert: ContainerHighCpuUsage
        expr: container_cpu_usage > 80
        for: 5m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "Container high CPU usage"
          description: "Container {{ $labels.container_name }} CPU usage is above 80% for more than 5 minutes. Current value: {{ $value }}%"

      - alert: ContainerHighMemoryUsage
        expr: container_memory_usage > 85
        for: 5m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "Container high memory usage"
          description: "Container {{ $labels.container_name }} memory usage is above 85% for more than 5 minutes. Current value: {{ $value }}%"

      - alert: ContainerRestartLoop
        expr: increase(container_restart_count[15m]) > 5
        for: 0m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "Container restart loop detected"
          description: "Container {{ $labels.container_name }} has restarted more than 5 times in the last 15 minutes"

      - alert: ContainerDown
        expr: up{job=~".*container.*"} == 0
        for: 1m
        labels:
          severity: critical
          service: docker
        annotations:
          summary: "Container is down"
          description: "Container {{ $labels.instance }} is down for more than 1 minute"

      # Service Health Alerts
      - alert: ServiceUnhealthy
        expr: health_check_total{status="unhealthy"} > 0
        for: 2m
        labels:
          severity: critical
          service: "{{ $labels.check_name }}"
        annotations:
          summary: "Service health check failed"
          description: "Service {{ $labels.check_name }} health check has been failing for more than 2 minutes"

      - alert: ServiceDegraded
        expr: health_check_total{status="warning"} > 0
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.check_name }}"
        annotations:
          summary: "Service is degraded"
          description: "Service {{ $labels.check_name }} health check is reporting warnings for more than 5 minutes"

      # Database Alerts
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is down for more than 1 minute"

      - alert: PostgresHighConnections
        expr: postgres_connections > 80
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "High PostgreSQL connections"
          description: "PostgreSQL connection count is above 80% of maximum for more than 5 minutes. Current: {{ $value }}"

      - alert: PostgresDatabaseSizeLarge
        expr: postgres_database_size_bytes > 10000000000  # 10GB
        for: 0m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "PostgreSQL database size is large"
          description: "PostgreSQL database size is above 10GB. Current size: {{ $value | humanize }}B"

      # Redis Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis is down for more than 1 minute"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_usage_bytes > 250000000  # 250MB
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is above 250MB for more than 5 minutes. Current: {{ $value | humanize }}B"

      - alert: RedisHighConnections
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Redis connections"
          description: "Redis connected clients is above 100 for more than 5 minutes. Current: {{ $value }}"

      # Nginx Alerts
      - alert: NginxDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: critical
          service: nginx
        annotations:
          summary: "Nginx is down"
          description: "Nginx is down for more than 1 minute"

      - alert: NginxHighErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: nginx
        annotations:
          summary: "High Nginx error rate"
          description: "Nginx error rate is above 10% for more than 5 minutes. Current: {{ $value | humanizePercentage }}"

      # Application Performance Alerts
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: application
        annotations:
          summary: "High response time"
          description: "95th percentile response time is above 5 seconds for more than 5 minutes. Current: {{ $value }}s"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: application
        annotations:
          summary: "High error rate"
          description: "Application error rate is above 5% for more than 5 minutes. Current: {{ $value | humanizePercentage }}"

      # Monitoring System Alerts
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
          service: prometheus
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus is down for more than 1 minute"

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 1m
        labels:
          severity: critical
          service: grafana
        annotations:
          summary: "Grafana is down"
          description: "Grafana is down for more than 1 minute"

      - alert: MonitoringServiceDown
        expr: up{job="cryptalk-monitoring"} == 0
        for: 1m
        labels:
          severity: critical
          service: monitoring
        annotations:
          summary: "Monitoring service is down"
          description: "CrysTalk monitoring service is down for more than 1 minute"

      # Custom Business Logic Alerts
      - alert: LowActiveUsers
        expr: active_users < 10
        for: 30m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Low active users"
          description: "Active users count is below 10 for more than 30 minutes. Current: {{ $value }}"

      - alert: QueueBacklog
        expr: queue_length > 1000
        for: 10m
        labels:
          severity: warning
          service: "{{ $labels.queue_name }}"
        annotations:
          summary: "Queue backlog detected"
          description: "Queue {{ $labels.queue_name }} has more than 1000 items for more than 10 minutes. Current: {{ $value }}"

      - alert: DocumentProcessingStalled
        expr: increase(documents_processed_total[10m]) == 0
        for: 10m
        labels:
          severity: warning
          service: document-processing
        annotations:
          summary: "Document processing stalled"
          description: "No documents have been processed in the last 10 minutes"

      # SSL Certificate Alerts
      - alert: SSLCertificateExpiringSoon
        expr: (ssl_certificate_expiry_timestamp - time()) / 86400 < 30
        for: 0m
        labels:
          severity: warning
          service: ssl
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} will expire in less than 30 days"

      - alert: SSLCertificateExpired
        expr: ssl_certificate_expiry_timestamp < time()
        for: 0m
        labels:
          severity: critical
          service: ssl
        annotations:
          summary: "SSL certificate expired"
          description: "SSL certificate for {{ $labels.instance }} has expired"

      # Log Volume Alerts
      - alert: HighLogVolume
        expr: rate(log_entries_total[5m]) > 1000
        for: 10m
        labels:
          severity: warning
          service: logging
        annotations:
          summary: "High log volume detected"
          description: "Log volume is above 1000 entries per minute for more than 10 minutes. Current: {{ $value }}"

      - alert: LogErrorSpike
        expr: rate(log_entries_total{level="error"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: logging
        annotations:
          summary: "Log error spike detected"
          description: "Error log rate is above 10 per minute for more than 2 minutes. Current: {{ $value }}"