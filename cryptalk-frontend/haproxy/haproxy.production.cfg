# ===========================================
# HAPROXY PRODUCTION CONFIGURATION
# ===========================================

global
    daemon
    maxconn 4096
    log stdout local0 info
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    
    # SSL Configuration
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    
    # Tuning
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.maxrewrite 8192

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option forwardfor
    option http-server-close
    option httpclose
    
    # Timeouts
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout http-request 10s
    timeout http-keep-alive 2s
    timeout check 10s
    
    # Error handling
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Statistics interface
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats show-legends
    stats show-node
    stats realm HAProxy\ Statistics
    # Add basic auth if needed
    # stats auth admin:password

# Main frontend
frontend main
    bind *:80
    mode http
    
    # Security headers
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # Rate limiting
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 20 }
    
    # Request routing
    use_backend api_backend if { path_beg /api/ }
    use_backend websocket_backend if { path_beg /ws }
    use_backend monitoring_backend if { hdr(host) -i grafana.cryptalk.com }
    use_backend monitoring_backend if { hdr(host) -i logs.cryptalk.com }
    use_backend monitoring_backend if { hdr(host) -i metrics.cryptalk.com }
    default_backend frontend_backend

# API Backend
backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    
    # Health check settings
    default-server inter 30s downinter 5s rise 2 fall 3 slowstart 60s maxconn 250
    
    # Compression
    compression algo gzip
    compression type text/html text/plain text/css text/javascript application/javascript application/json
    
    # Caching
    http-request cache-use api_cache
    http-response cache-store api_cache
    
    # API servers
    server api1 api:3001 check
    # Add more API servers for scaling
    # server api2 api-2:3001 check
    # server api3 api-3:3001 check

# WebSocket Backend
backend websocket_backend
    mode http
    balance source
    option httpchk GET /health
    
    # WebSocket specific settings
    timeout tunnel 3600s
    timeout server 3600s
    timeout client 3600s
    
    # WebSocket servers
    server ws1 api:3001 check
    # Add more WebSocket servers
    # server ws2 api-2:3001 check

# Frontend Backend
backend frontend_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    
    # Health check settings
    default-server inter 30s downinter 5s rise 2 fall 3 slowstart 60s maxconn 250
    
    # Compression
    compression algo gzip
    compression type text/html text/plain text/css text/javascript application/javascript
    
    # Static file caching
    http-request cache-use static_cache
    http-response cache-store static_cache
    
    # Frontend servers
    server frontend1 frontend:3000 check
    # Add more frontend servers for scaling
    # server frontend2 frontend-2:3000 check

# Monitoring Backend
backend monitoring_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    
    # Basic auth for monitoring
    # http-request auth realm MonitoringAuth unless { http_auth(monitoring_users) }
    
    # Route based on host
    use-server grafana if { hdr(host) -i grafana.cryptalk.com }
    use-server kibana if { hdr(host) -i logs.cryptalk.com }
    use-server prometheus if { hdr(host) -i metrics.cryptalk.com }
    
    server grafana grafana:3000 check
    server kibana kibana:5601 check
    server prometheus prometheus:9090 check

# Database Backend (for internal use)
backend database_backend
    mode tcp
    balance roundrobin
    option tcp-check
    
    # Database servers
    server postgres postgres:5432 check
    server redis redis:6379 check

# Cache configuration
cache api_cache
    total-max-size 128m
    max-age 300
    max-object-size 10m

cache static_cache
    total-max-size 256m
    max-age 3600
    max-object-size 50m

# User authentication (if needed)
# userlist monitoring_users
#     user admin password $6$rounds=10000$salt$hash

